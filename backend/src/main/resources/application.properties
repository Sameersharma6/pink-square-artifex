spring.application.name=pink-square-artifex
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pink_square_artifex}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Postgres@1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_32_CHARS_MINIMUM}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@pinksquareartifex.com}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
